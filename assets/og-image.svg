<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="og-title">
  <title id="og-title">Mohan Raaj - Code for the Joy. Curious by nature. Software Developer</title>

  <rect width="1200" height="630" fill="#F9FAFC"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <!-- Identity -->
    <text
      x="96"
      y="168"
      fill="#2B3548"
      font-size="44"
      font-weight="700"
      letter-spacing="-0.01em"
    >Mohan Raaj</text>

    <!-- Sky-blue accent rule -->
    <rect x="96" y="196" width="72" height="4" rx="2" fill="#4A8DB8"/>

    <!-- Primary tagline -->
    <text
      x="96"
      y="292"
      fill="#2B3548"
      font-size="72"
      font-weight="600"
      letter-spacing="-0.02em"
    >Code for the Joy.</text>

    <!-- Secondary tagline -->
    <text
      x="96"
      y="364"
      fill="#6E7A8A"
      font-size="40"
      font-weight="500"
    >Curious by nature.</text>

    <!-- Supporting role -->
    <text
      x="96"
      y="430"
      fill="#4A8DB8"
      font-size="32"
      font-weight="500"
      letter-spacing="0.01em"
    >Software Developer</text>
  </g>
</svg>
